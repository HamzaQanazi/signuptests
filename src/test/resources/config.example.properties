signup.url=https://web.openrainbow.net/rb/2.181.0/subscribe
# each run signs up as <prefix><millis>@gmail.com, so every address is new
# use your own mailbox: <name>+x lands in <name>@gmail.com
signup.emailPrefix=your-mailbox+x
signup.password=Test@Passw0rd123
# an account that is already registered AND whose mail arrives in the mail.user inbox
signup.existingEmail=your-mailbox+x0@gmail.com
# mailbox that receives the 6-digit code (IMAP + Gmail App Password)
mail.user=your-mailbox@gmail.com
mail.appPassword=your-app-password
